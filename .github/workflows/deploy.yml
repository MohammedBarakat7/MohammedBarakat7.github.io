name: Deploy static site

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "cv.html"
      - "style.css"
      - "script.js"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/assets/img
          cp index.html cv.html style.css script.js _site/
          cp assets/img/prof_pic.jpg _site/assets/img/prof_pic.jpg
          touch _site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          clean: true
